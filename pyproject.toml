[build-system]
build-backend = "flit_scm:buildapi"
requires = [ "flit-core>=3.2", "flit-scm", "wheel" ]

[project]
name = "django-crontask"
readme = "README.md"
keywords = [ "cron", "Django", "scheduler", "tasks" ]
license = { file = "LICENSE" }
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Communications :: Email",
  "Topic :: Software Development",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dynamic = [ "description", "version" ]
dependencies = [ "apscheduler", "django>=6" ]
[[project.authors]]
name = "Rust Saiargaliev"
email = "fly.amureki@gmail.com"

[[project.authors]]
name = "Johannes Maron"
email = "johannes@maron.family"

[[project.authors]]
name = "Mostafa Mohamed"
email = "mostafa.anm91@gmail.com"

[[project.authors]]
name = "Jacqueline Kraus"
email = "jacquelinekraus1992@gmail.com"
[project.optional-dependencies]
redis = [ "redis" ]
sentry = [ "sentry-sdk" ]
[project.urls]
Changelog = "https://github.com/codingjoe/django-crontask/releases"
Documentation = "https://django-crontask.rtfd.io/"
Funding = "https://github.com/sponsors/codingjoe"
# https://packaging.python.org/en/latest/specifications/well-known-project-urls/#well-known-labels
Homepage = "https://github.com/codingjoe/django-crontask"
Issues = "https://github.com/codingjoe/django-crontask/issues"
Releasenotes = "https://github.com/codingjoe/django-crontask/releases/latest"
Source = "https://github.com/codingjoe/django-crontask"

[dependency-groups]
dev = [
  { include-group = "test" },
]
test = [
  "fakeredis[lua]",
  "pytest",
  "pytest-cov",
  "pytest-django",
]

[tool.setuptools_scm]
write_to = "crontask/_version.py"

[tool.flit]
[tool.flit.module]
name = "crontask"

[tool.ruff]
src = [ "crontask", "tests" ]
[tool.ruff.lint]
extend-select = [
  "C90",
  "D",
  "D213",
  "DJ",
  "E",
  "G",
  "N",
  "PERF",
  "PT",
  "PTH",
  "RET",
  "S",
  "SIM",
  "SLOT",
  "T20",
  "TRY",
  "UP",
  "W",
]
ignore = [ "D1", "D203", "D212", "E501", "RUF01" ]
per-file-ignores."tests/**" = [ "DJ006", "DJ007", "DJ008", "PLR2004", "S101", "S105", "S106", "S311", "S603", "S607" ]
isort.combine-as-imports = true
isort.force-wrap-aliases = true
isort.section-order = [ "future", "standard-library", "third-party", "first-party", "local-folder" ]
isort.split-on-trailing-comma = true
pydocstyle.convention = "pep257"

[tool.pytest]
[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [ "tests" ]
addopts = "--cov --cov-report=xml --cov-report=term --tb=short -rxs"
DJANGO_SETTINGS_MODULE = "tests.testapp.settings"

[tool.coverage]
[tool.coverage.run]
source = [ "crontask" ]
[tool.coverage.report]
skip_covered = true
show_missing = true
