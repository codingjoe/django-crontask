[build-system]
build-backend = "flit_scm:buildapi"
requires = [ "flit-core>=3.2", "flit-scm", "wheel" ]

[project]
name = "django-crontask"
readme = "README.md"
keywords = [ "cron", "Django", "scheduler", "tasks" ]
license = { file = "LICENSE" }
authors = [
  { name = "Rust Saiargaliev", email = "fly.amureki@gmail.com" },
  { name = "Johannes Maron", email = "johannes@maron.family" },
  { name = "Mostafa Mohamed", email = "mostafa.anm91@gmail.com" },
  { name = "Jacqueline Kraus", email = "jacquelinekraus1992@gmail.com" },
]
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Communications :: Email",
  "Topic :: Software Development",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dynamic = [ "description", "version" ]
dependencies = [ "apscheduler", "django>=6" ]
optional-dependencies.redis = [ "redis" ]
optional-dependencies.sentry = [ "sentry-sdk" ]
urls.Changelog = "https://github.com/codingjoe/django-crontask/releases"
urls.Documentation = "https://django-crontask.rtfd.io/"
urls.Funding = "https://github.com/sponsors/codingjoe"
# https://packaging.python.org/en/latest/specifications/well-known-project-urls/#well-known-labels
urls.Homepage = "https://github.com/codingjoe/django-crontask"
urls.Issues = "https://github.com/codingjoe/django-crontask/issues"
urls.Releasenotes = "https://github.com/codingjoe/django-crontask/releases/latest"
urls.Source = "https://github.com/codingjoe/django-crontask"

[dependency-groups]
dev = [
  { include-group = "test" },
]
test = [
  "fakeredis[lua]",
  "pytest",
  "pytest-cov",
  "pytest-django",
]

[tool.setuptools_scm]
write_to = "crontask/_version.py"

[tool.flit]
module.name = "crontask"

[tool.ruff]
src = [ "crontask", "tests" ]
lint.select = [
  "B",  # flake8-bugbear
  "C",  # flake8-comprehensions
  "D",  # pydocstyle
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # isort
  "S",  # flake8-bandit
  "UP", # pyupgrade
  "W",  # pycodestyle warnings
]
lint.ignore = [ "B904", "D1", "E501", "S101" ]
lint.isort.combine-as-imports = true
lint.isort.force-wrap-aliases = true
lint.isort.section-order = [ "future", "standard-library", "third-party", "first-party", "local-folder" ]
lint.isort.split-on-trailing-comma = true
lint.pydocstyle.convention = "pep257"

[tool.pytest]
ini_options.minversion = "6.0"
ini_options.testpaths = [ "tests" ]
ini_options.addopts = "--cov --cov-report=xml --cov-report=term --tb=short -rxs"
ini_options.DJANGO_SETTINGS_MODULE = "tests.testapp.settings"

[tool.coverage]
run.source = [ "crontask" ]
report.skip_covered = true
report.show_missing = true
