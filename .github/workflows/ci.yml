name: CI
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uvx --from build pyproject-build --sdist --wheel
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*
  pytest-linux:
    name: Pytest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        os:
          - "ubuntu-latest"
        python-version:
          - "3.14"
        django-version:
          - "6.0"
        extras:
          - "" # We try a run without any extras
          - "--extra sentry"
          - "--extra redis"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run ${{ matrix.extras }} --with django~=${{ matrix.django-version }}.0 pytest
      - uses: codecov/codecov-action@v7
        with:
          use_oidc: true
  pytest-windows-macos:
    name: Pytest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        os:
          - "windows-latest"
          - "macos-latest"
        python-version:
          - "3.14"
        django-version:
          - "6.0"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run --with django~=${{ matrix.django-version }}.0 pytest
      - uses: codecov/codecov-action@v7
        with:
          use_oidc: true
